name: Publicar versió

# Genera el paquet d'actualització i el manifest quan es publica una etiqueta v*.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Versió a publicar (X.Y.Z). Si es deixa buit, s'agafa la d'app/version.php"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cros
          MARIADB_USER: cros
          MARIADB_PASSWORD: cros
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, gd, mbstring, pdo_mysql, curl

      - name: Determinar la versió
        id: versio
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(php -r 'echo (require "app/version.php")["version"];')"
          fi
          echo "Versió a publicar: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Comprovar la sintaxi de tots els fitxers
        run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Proves funcionals
        run: |
          CROS_TEST_FRESH=1 php tests/env.php
          php -S 127.0.0.1:8123 -t . tests/server.php &
          sleep 3
          php tests/functional.php

      - name: Proves de la cursa (dorsals i resultats)
        run: php tests/race.php

      - name: Proves de «Les meves inscripcions»
        run: php tests/account.php

      - name: Proves de les migracions
        run: php tests/migrations.php

      - name: Proves del mapa de la ubicació
        run: php tests/map.php

      - name: Proves dels enviaments de correu
        run: php tests/mailings.php

      - name: Eines per comprovar els PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Proves del motor de PDF
        run: php tests/pdf.php

      - name: Proves del sistema d'actualitzacions
        run: php tests/updates.php

      - name: Prova de l'instal·lador (MySQL real)
        env:
          CROS_DB_HOST: 127.0.0.1
          CROS_DB_PORT: '3306'
          CROS_DB_NAME: cros
          CROS_DB_USER: cros
          CROS_DB_PASS: cros
        run: php tests/installer.php

      - name: Generar el paquet
        env:
          VERSION: ${{ steps.versio.outputs.version }}
          TAG: ${{ steps.versio.outputs.tag }}
        run: |
          php tools/build-release.php --version="$VERSION" \
            --url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

      - name: Preparar les notes de la versió
        env:
          VERSION: ${{ steps.versio.outputs.version }}
        run: |
          SHA=$(php -r 'echo json_decode(file_get_contents("dist/manifest.json"), true)["sha256"];')
          {
            awk -v v="## [$VERSION]" 'index($0, v) == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            echo "**Paquet d'actualització:** \`cros-escolar-$VERSION.zip\`"
            echo ""
            echo "**SHA-256:** \`$SHA\`"
            echo ""
            echo "Per actualitzar un web ja instal·lat: Panell → Sistema → Actualitzacions → Comprovar ara."
          } > dist/notes.md
          cat dist/notes.md

      - name: Publicar la versió
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versio.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Cros Escolar La Granada ${{ steps.versio.outputs.tag }}"
          files: |
            dist/*.zip
            dist/manifest.json
          body_path: dist/notes.md
