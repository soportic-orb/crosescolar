name: Publicar versió

# Genera el paquet d'actualització i el manifest quan es publica una etiqueta v*.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cros
          MARIADB_USER: cros
          MARIADB_PASSWORD: cros
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, gd, mbstring

      - name: Comprovar la sintaxi de tots els fitxers
        run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Proves funcionals
        run: |
          CROS_TEST_FRESH=1 php tests/env.php
          php -S 127.0.0.1:8123 -t . tests/server.php &
          sleep 3
          php tests/functional.php

      - name: Proves del sistema d'actualitzacions
        run: php tests/updates.php

      - name: Prova de l'instal·lador (MySQL real)
        env:
          CROS_DB_HOST: 127.0.0.1
          CROS_DB_PORT: '3306'
          CROS_DB_NAME: cros
          CROS_DB_USER: cros
          CROS_DB_PASS: cros
        run: php tests/installer.php

      - name: Generar el paquet
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          php tools/build-release.php --version="${VERSION:-1.0.0}" \
            --url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Publicar la versió
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/manifest.json
          body_path: CHANGELOG.md
