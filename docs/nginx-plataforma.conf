# ============================================================================
# Cros Escolar — nginx per a la plataforma multi-instància
#
# Un sol servidor i una sola còpia del codi atenen tots els subdominis dels
# dominis de la plataforma (aquí, crosescolar.cat i crosescolar.com):
#   granada.crosescolar.cat, vilafranca.crosescolar.cat…  el web de cada client
#   crosescolar.cat i www.crosescolar.cat                 la pàgina pública
#   admin.crosescolar.cat                                 la superadministració
#
# Cada client tria en quin domini vol el seu web; les adreces de l'altre domini
# hi menen soles amb una redirecció 301 que fa el codi. Per això nginx ha de
# servir els dos dominis igual: qui és qui ho decideix el codi llegint la
# capçalera Host, i nginx només ha de saber trobar els fitxers pujats de cada
# instància, que són a la seva carpeta.
#
# Cal, al DNS de cada domini: un registre A per al domini i un de comodí
# (*.crosescolar.cat, *.crosescolar.com) apuntant al servidor, i un certificat
# de Let's Encrypt amb comodí per a cadascun (validació DNS-01, que és l'única
# que serveix per als comodins):
#
#   certbot certonly --dns-<proveïdor> \
#     -d crosescolar.cat -d '*.crosescolar.cat' \
#     -d crosescolar.com -d '*.crosescolar.com'
#
# Amb tots els noms al mateix certificat n'hi ha prou amb un sol bloc server{}.
# ============================================================================

# El subdomini de la petició, per trobar-ne els fitxers pujats.
# Va al context http{} (a Clouding, dins de /etc/nginx/nginx.conf o un fitxer
# de conf.d), no dins del server{}.
map $host $cros_slug {
    default                                                          "";
    "~^(?<sub>[a-z0-9][a-z0-9-]*)\.crosescolar\.(cat|com)$"          $sub;
}

server {
    listen 443 ssl http2;
    server_name crosescolar.cat *.crosescolar.cat crosescolar.com *.crosescolar.com;

    # La carpeta on hi ha index.php. Aquest projecte no té cap «public/»:
    # l'arrel és la de l'aplicació, i les carpetes internes es tanquen més avall.
    root /var/www/crosescolar;
    index index.php;

    # Un sol certificat amb els quatre noms (els dos dominis i els seus comodins).
    ssl_certificate     /etc/letsencrypt/live/crosescolar.cat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crosescolar.cat/privkey.pem;

    # 1) URLs amigables: tot el que no sigui un fitxer real va a index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2) Els fitxers pujats són de cada instància
    location ^~ /uploads/ {
        alias /var/www/crosescolar/tenants/$cros_slug/uploads/;
        location ~ \.(php|phtml|phar)$ { deny all; return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        expires 30d;
        try_files $uri =404;
    }

    # 3) Carpetes internes: mai accessibles des del navegador
    location ^~ /app/      { deny all; return 404; }
    location ^~ /storage/  { deny all; return 404; }
    location ^~ /tenants/  { deny all; return 404; }
    location ^~ /tools/    { deny all; return 404; }
    location ^~ /docs/     { deny all; return 404; }
    location ~ /\.(git|env|htaccess) { deny all; return 404; }
    location ~ ^/(CHANGELOG\.md|README\.md|install\.php)$ { deny all; return 404; }

    # 4) Memòria cau dels recursos estàtics (són comuns a totes les instàncies)
    location ~* ^/assets/.*\.(css|js|svg|woff2?|png|jpe?g|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 5) PHP
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 32M;
}

# Tot el trànsit sense xifrar va a HTTPS.
server {
    listen 80;
    server_name crosescolar.cat *.crosescolar.cat crosescolar.com *.crosescolar.com;
    return 301 https://$host$request_uri;
}
