# ============================================================================
# Cros Escolar — nginx per a la plataforma multi-instància
#
# Un sol servidor i una sola còpia del codi atenen tots els subdominis:
#   granada.crosescolar.com, vilafranca.crosescolar.com…  el web de cada client
#   crosescolar.com i www.crosescolar.com                 la pàgina pública
#   admin.crosescolar.com                                 la superadministració
#
# Qui és qui ho decideix el codi llegint la capçalera Host; nginx només ha de
# saber servir els fitxers pujats de cada instància, que són a la seva carpeta.
#
# Cal, al DNS: un registre A per a crosescolar.com i un de comodí *.crosescolar.com
# apuntant al servidor, i un certificat de Let's Encrypt amb comodí (validació
# DNS-01, que és l'única que serveix per als comodins).
# ============================================================================

# El subdomini de la petició, per trobar-ne els fitxers pujats.
# Va al context http{} (a Clouding, dins de /etc/nginx/nginx.conf o un fitxer
# de conf.d), no dins del server{}.
map $host $cros_slug {
    default                          "";
    "~^(?<sub>[a-z0-9][a-z0-9-]*)\.crosescolar\.com$"  $sub;
}

server {
    listen 443 ssl http2;
    server_name crosescolar.com *.crosescolar.com;

    root /var/www/crosescolar/public;   # la carpeta on hi ha index.php
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/crosescolar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crosescolar.com/privkey.pem;

    # 1) URLs amigables: tot el que no sigui un fitxer real va a index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2) Els fitxers pujats són de cada instància
    location ^~ /uploads/ {
        alias /var/www/crosescolar/tenants/$cros_slug/uploads/;
        location ~ \.(php|phtml|phar)$ { deny all; return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        expires 30d;
        try_files $uri =404;
    }

    # 3) Carpetes internes: mai accessibles des del navegador
    location ^~ /app/     { deny all; return 404; }
    location ^~ /storage/ { deny all; return 404; }
    location ^~ /tenants/ { deny all; return 404; }
    location ~ /\.(git|env|htaccess) { deny all; return 404; }

    # 4) Memòria cau dels recursos estàtics (són comuns a totes les instàncies)
    location ~* ^/assets/.*\.(css|js|svg|woff2?|png|jpe?g|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 5) PHP
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 32M;
}

# Tot el trànsit sense xifrar va a HTTPS.
server {
    listen 80;
    server_name crosescolar.com *.crosescolar.com;
    return 301 https://$host$request_uri;
}
