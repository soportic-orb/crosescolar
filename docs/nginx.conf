# ============================================================================
# Cros Escolar La Granada — configuració d'nginx (CloudPanel)
#
# A CloudPanel: Sites → cros.afalagranada.cat → Vhost, i enganxeu els blocs
# "location" dins del server{} existent (mantenint la línia de PHP-FPM).
# ============================================================================

# 1) URLs amigables: tot el que no sigui un fitxer real va a index.php
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 2) Carpetes internes: mai accessibles des del navegador
location ^~ /app/     { deny all; return 404; }
location ^~ /storage/ { deny all; return 404; }
location ~ /\.(git|env|htaccess) { deny all; return 404; }

# 3) Els fitxers pujats no s'executen mai com a PHP
location ^~ /uploads/ {
    location ~ \.(php|phtml|phar)$ { deny all; return 404; }
    add_header X-Content-Type-Options "nosniff" always;
    expires 30d;
    try_files $uri =404;
}

# 4) Memòria cau dels recursos estàtics
location ~* ^/assets/.*\.(css|js|svg|woff2?|png|jpe?g|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# 5) Capçaleres de seguretat
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 6) Mida màxima de pujada (banner, galeria, paquets d'actualització)
client_max_body_size 32M;

# NOTA: el webhook de Stripe ha de rebre el cos sense modificar.
# No activeu cap filtre que reescrigui el cos de /stripe/webhook.
